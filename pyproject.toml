[project]
name = "midojo"
version = "0.1.0"
description = "Man-in-the-middle red teaming for AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
requires-python = ">= 3.12"
dependencies = [
    # The episode document, the snapshot codec, the plan codec and the host
    # interceptor's MCP client all live in the SDK, so MiDojo depends on it as
    # a base package. The mcp extra pins FastMCP, which the interceptor needs.
    "midojo-sdk[mcp]",
    "pydantic>=2.7.1",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "a2a-sdk>=1.0",
    # The OpenShell runtime uses the 0.1 sandbox exec and log APIs, which
    # require a 0.1.x gateway.
    "openshell>=0.1.2",
    "grpcio>=1.60",
    # OpenShell's generated protobuf code targets the 6.31.x runtime.
    "protobuf>=6.31.1",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/asago-ai/midojo"
Repository = "https://github.com/asago-ai/midojo"
Issues = "https://github.com/asago-ai/midojo/issues"

[project.optional-dependencies]
# Dependencies for running the bundled suites' example agents (a2a, ogx, ...).
suites = [
    "midojo-sdk[mcp]",
    "fastmcp",
    "ogx>=0.8.0,<0.9.0",
    "ogx-client>=0.8.0,<0.9.0",
    "faiss-cpu",
    "chardet",
    "pypdf",
    "openai>=1.0",
]
# The PyRIT route (midojo.pyrit): a PyRIT target and scorers over MiDojo
# episodes. PyRIT's API broke at 0.10 and 1.0, so it is pinned to 1.1.
pyrit = [
    "midojo-sdk[mcp]",
    "pyrit>=1.1.0,<1.2",
]
dev = [
    "midojo-sdk[mcp,langchain]",
    "jsonschema>=4.23",
    "pytest>=8.0.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.3.0",
    "pyright>=1.1.362",
    "python-dotenv[cli]>=1.0.0",
]

[project.scripts]
midojo-serve = "midojo.serve:main"
midojo-run = "midojo.orchestrator:main"
weather-tools-serve = "suites.weather.tools_server:main"
minibank-real-mcp-serve = "suites.minibank.a2a_agent.real_mcp:main"
minibank-a2a-agent = "suites.minibank.a2a_agent.agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midojo", "suites"]

[tool.hatch.build.targets.sdist]
include = ["/src/midojo", "/suites", "/tests", "/examples", "/pyproject.toml", "/README.md", "/LICENSE"]

[tool.uv]
managed = true

[tool.uv.workspace]
members = ["interception/python-sdk"]

[tool.uv.sources]
midojo-sdk = { workspace = true }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "UP", "I", "ERA", "N", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

# Optional route: checked with pyright-pyrit.json after installing the pyrit extra.
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "src/midojo/pyrit",
    "examples/pyrit_weather.py",
    "tests/test_pyrit_*.py",
]
