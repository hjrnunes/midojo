[project]
name = "midojo-mim"
version = "0.1.0"
description = "MiDojo's man-in-the-middle interceptor: the service that binds an evaluation over a WebSocket, injection placement, the MCP face and the recorder and world adapters"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Typing :: Typed",
]
requires-python = ">= 3.11"
dependencies = [
    # Every contract the interceptor speaks: the plan, the binding frames, the
    # recorder seams and the tool policy. Nothing of MiDojo's harness.
    "midojo-spec",
    # midojo_mim.mcp wraps FastMCP's private low-level server (_mcp_server:
    # request_handlers and run), which a minor release may change, so a new
    # minor is a deliberate upgrade; tests/test_fastmcp_compat.py names the
    # hooks. 4.0 removed fastmcp.tools.tool, which mcp.py imports ToolResult from.
    "fastmcp>=3.2.4,<3.3",
    # Imported directly (mcp.types, mcp.shared.exceptions); FastMCP pins its range.
    "mcp",
    "anyio",
    "pydantic>=2.7.1",
    "starlette",
    "uvicorn>=0.34",
    # The service runs uvicorn's websockets-sansio backend: the package must be
    # installed, and it must outlive its arrival as a FastMCP dependency. The API
    # in use is in 16 and 17.
    "websockets>=16,<18",
]

[project.scripts]
midojo-intercept-serve = "midojo_mim.service:main"

[project.urls]
Homepage = "https://github.com/asago-ai/midojo"
Repository = "https://github.com/asago-ai/midojo"
Issues = "https://github.com/asago-ai/midojo/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midojo_mim"]

[tool.hatch.build.targets.sdist]
include = ["/src/midojo_mim", "/tests", "/Containerfile", "/pyproject.toml", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

# The repository's rules, at this package's floor: ruff would otherwise rewrite code
# to the repository's Python 3.12.
[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py311"
