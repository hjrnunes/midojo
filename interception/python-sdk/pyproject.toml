[project]
name = "midojo-sdk"
version = "0.1.0"
description = "Build MiDojo interception layers for AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">= 3.12"
dependencies = [
    "httpx>=0.28",
]

[project.optional-dependencies]
mcp = [
    # 4.0 removed fastmcp.tools.tool, which mcp.py imports ToolResult from.
    # MidojoMCP also wraps FastMCP's private low-level server (_mcp_server:
    # request_handlers and run), which a minor release may change, so a new
    # minor is a deliberate upgrade; tests/test_fastmcp_compat.py names the hooks.
    "fastmcp>=3.2.4,<3.3",
]
langchain = [
    "langchain>=1.4",
]

[project.urls]
Homepage = "https://github.com/asago-ai/midojo"
Repository = "https://github.com/asago-ai/midojo"
Issues = "https://github.com/asago-ai/midojo/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midojo_sdk"]
