[project]
name = "midojo-sdk"
version = "0.1.0"
description = "Build MiDojo interception layers for AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
requires-python = ">= 3.12"
dependencies = [
    "httpx>=0.28",
    # The plan, snapshot, recorder and binding contracts the SDK speaks.
    "midojo-spec",
]

[project.optional-dependencies]
mcp = [
    # The MCP face (midojo_sdk.mcp subclasses it) lives in midojo-mim, which
    # pins FastMCP.
    "midojo-mim",
    # binding.py, the driver's WebSocket adapter, imports websockets.asyncio
    # directly: before this it arrived only as a fastmcp dependency, and the
    # adapter must outlive that arrangement. The API it uses is in 16 and 17.
    "websockets>=16,<18",
]
langchain = [
    "langchain>=1.4",
]

[project.urls]
Homepage = "https://github.com/asago-ai/midojo"
Repository = "https://github.com/asago-ai/midojo"
Issues = "https://github.com/asago-ai/midojo/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midojo_sdk"]
