apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deploy everything into one namespace. Change this (or override with
# `kustomize build | oc apply -n <ns> -f -`) to suit.
namespace: midojo-minibank

# Point every component at the image you built and pushed. Override the tag/name
# here instead of editing each manifest.
images:
  - name: midojo
    newName: quay.io/REPLACE_ME/midojo
    newTag: latest

resources:
  - real-mcp.yaml
  - control-plane.yaml
  - agent.yaml
  - run-ladder.job.yaml
  - network-policy.yaml

# NOTE: the agent's LLM-credentials Secret (minibank-llm-creds) and the control
# token Secret (minibank-control-token) are intentionally NOT listed here —
# create them separately so real secrets never get committed. See
# agent-secret.example.yaml and control-token-secret.example.yaml.
