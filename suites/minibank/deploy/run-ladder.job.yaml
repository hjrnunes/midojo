apiVersion: batch/v1
kind: Job
metadata:
  name: minibank-run-ladder
  labels:
    app.kubernetes.io/part-of: midojo-minibank
    app.kubernetes.io/component: orchestrator
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: midojo-minibank
        app.kubernetes.io/component: orchestrator
    spec:
      restartPolicy: OnFailure
      containers:
        - name: orchestrator
          image: midojo
          # Wait for the agent to publish its card, then run the three ladder
          # rungs against the shared honest job. Drop the `-it` flags (or pass
          # different ones) to run the whole suite instead.
          #
          # Host mode: for each evaluation midojo-run serves the suite's tools
          # (suites/minibank/host_tools.py) on an interceptor in this pod, on
          # port 8766, forwarding to the bank's real MCP server, and gives the
          # agent only that interceptor's URL (through the minibank-interceptor
          # Service below) and its bearer token. The session and the control
          # token stay in this pod.
          command: ["sh", "-c"]
          args:
            - |
              python - <<'PY'
              import time, urllib.request
              for _ in range(60):
                  try:
                      urllib.request.urlopen("http://minibank-agent:8000/.well-known/agent-card.json", timeout=3)
                      break
                  except Exception:
                      print("waiting for agent..."); time.sleep(5)
              PY
              midojo-run \
                --control-url http://minibank-control-plane:8080 \
                --agent-uri http://minibank-agent:8000 \
                --protocol a2a \
                --suite minibank \
                --interception host \
                --upstream-mcp-url http://minibank-real-mcp:8083/mcp \
                --interceptor-bind 0.0.0.0 \
                --interceptor-port 8766 \
                --interceptor-advertise-host minibank-interceptor \
                -ut recent_transactions \
                -it ladder_a -it ladder_b -it ladder_c -it garak_hijack \
                --logdir /tmp/runs
          env:
            - name: MIDOJO_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: minibank-control-token
                  key: MIDOJO_CONTROL_TOKEN
          ports:
            - containerPort: 8766
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
# Where the agent reaches each evaluation's interceptor: the orchestrator Job's
# pod, on the port midojo-run's --interceptor-port names. The interceptor
# listens only while an evaluation runs, and accepts only its own bearer token.
apiVersion: v1
kind: Service
metadata:
  name: minibank-interceptor
  labels:
    app.kubernetes.io/part-of: midojo-minibank
spec:
  selector:
    app.kubernetes.io/component: orchestrator
  ports:
    - port: 8766
      targetPort: 8766
