# The control token the control plane and the orchestrator share: midojo-serve
# requires it on every route but /agent and /health, and midojo-run needs it for
# --interception host. The agent never gets it. DO NOT commit a real value —
# apply it separately (it is intentionally NOT in kustomization.yaml).
# Equivalent one-liner:
#
#   oc create secret generic minibank-control-token \
#     --from-literal=MIDOJO_CONTROL_TOKEN="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: minibank-control-token
  labels:
    app.kubernetes.io/part-of: midojo-minibank
type: Opaque
stringData:
  MIDOJO_CONTROL_TOKEN: "REPLACE_ME"
